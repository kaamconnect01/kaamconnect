{% extends 'base.html' %}
{% block content %}
<style>
    /* =========================================
       PREMIUM GLASSMORPHISM SAAS REDESIGN
       ========================================= */
    :root {
        --glass-bg: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --hover-gradient: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        
        --input-bg: rgba(255, 255, 255, 0.9);
        --input-border: rgba(102, 126, 234, 0.3);
        --input-focus: #667eea;
    }

    /* Animated Colorful Background for the page wrapper */
    .animated-bg-wrapper {
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradientBG 12s ease infinite;
        min-height: 90vh;
        border-radius: 20px;
        display: flex;
        align-items: center;
        padding: 2rem 0;
        margin: 1rem 0;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Glassmorphism Card */
    .auth-glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: var(--glass-shadow);
        overflow: hidden;
    }

    /* Compact Role Grid Cards (Glass Theme) */
    .role-card {
        border: 2px solid transparent;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        position: relative;
        overflow: hidden;
    }
    
    .role-card:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    
    .role-card.active {
        border-color: #667eea;
        background: #ffffff;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
    }
    
    .role-card.active::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: var(--primary-gradient);
    }

    .role-icon-box {
        width: 45px;
        height: 45px;
        border-radius: 12px;
        background: rgba(102, 126, 234, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        font-size: 1.2rem;
    }
    
    .role-card.active .role-icon-box {
        background: var(--primary-gradient);
        color: white !important;
        transform: scale(1.1);
    }

    /* Premium Modern Glass Inputs */
    .glass-input-group {
        background: var(--input-bg);
        border-radius: 12px;
        border: 1.5px solid var(--input-border);
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .glass-input-group:focus-within {
        border-color: var(--input-focus);
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        background: #ffffff;
    }

    .glass-input-group .input-group-text {
        background: transparent;
        border: none;
        color: #64748b;
    }
    
    .glass-input-group:focus-within .input-group-text {
        color: var(--input-focus);
    }

    .glass-input-group .form-control, 
    .glass-input-group .form-select {
        border: none;
        background: transparent;
        color: #1e293b;
        font-size: 0.9rem;
    }

    .glass-input-group .form-control:focus, 
    .glass-input-group .form-select:focus {
        box-shadow: none;
        background: transparent;
    }

    /* Primary Gradient Button */
    .btn-gradient {
        background: var(--primary-gradient);
        color: white;
        border: none;
        border-radius: 12px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .btn-gradient:hover {
        background: var(--hover-gradient);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    .glass-badge {
        background: rgba(255, 255, 255, 0.7);
        color: #764ba2;
        border: 1px solid rgba(118, 75, 162, 0.2);
        padding: 5px 15px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 0.75rem;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    @keyframes slideUpFade {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .dynamic-field-anim {
        animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
</style>

<div class="container py-2">
    <!-- Animated Gradient Background Wrapper -->
    <div class="animated-bg-wrapper shadow-lg">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-9">
                    
                    <div class="auth-glass-card p-4 p-md-5">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <span class="glass-badge mb-2 d-inline-block">Kaamconnect</span>
                            <h3 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">Join the Network</h3>
                            <p class="text-muted small mb-0" style="font-size: 0.9rem;">Select your profile type to proceed instantly.</p>
                        </div>

                        <!-- Error Message / Flash messages will appear above the form beautifully if any -->
                        
                        <form method="POST" action="">
                            
                            <!-- Role Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-bold text-uppercase text-secondary mb-3 d-block text-center" style="font-size: 0.75rem; letter-spacing: 1px;">Choose Profile Category</label>
                                <div class="row g-3">
                                    
                                    <div class="col-4">
                                        <div class="role-card text-center p-3 h-100 d-flex flex-column align-items-center justify-content-center" id="card_customer" onclick="selectRole('customer')">
                                            <div class="role-icon-box mb-2 text-primary">
                                                <i class="fa-solid fa-user-tie"></i>
                                            </div>
                                            <h6 class="fw-bold text-dark mb-1" style="font-size: 0.85rem;">Customer</h6>
                                            <span class="text-muted d-none d-md-block" style="font-size: 0.7rem;">Kaam karwana hai</span>
                                            <input type="radio" name="role" id="role_customer" value="customer" required class="d-none">
                                        </div>
                                    </div>

                                    <div class="col-4">
                                        <div class="role-card text-center p-3 h-100 d-flex flex-column align-items-center justify-content-center" id="card_shop_owner" onclick="selectRole('shop_owner')">
                                            <div class="role-icon-box mb-2 text-success">
                                                <i class="fa-solid fa-shop"></i>
                                            </div>
                                            <h6 class="fw-bold text-dark mb-1" style="font-size: 0.85rem;">Shop Owner</h6>
                                            <span class="text-muted d-none d-md-block" style="font-size: 0.7rem;">Business & Leads</span>
                                            <input type="radio" name="role" id="role_shop_owner" value="shop_owner" class="d-none">
                                        </div>
                                    </div>

                                    <div class="col-4">
                                        <div class="role-card text-center p-3 h-100 d-flex flex-column align-items-center justify-content-center" id="card_worker" onclick="selectRole('worker')">
                                            <div class="role-icon-box mb-2 text-warning">
                                                <i class="fa-solid fa-helmet-safety"></i>
                                            </div>
                                            <h6 class="fw-bold text-dark mb-1" style="font-size: 0.85rem;">Skilled Worker</h6>
                                            <span class="text-muted d-none d-md-block" style="font-size: 0.7rem;">Daily/Monthly Job</span>
                                            <input type="radio" name="role" id="role_worker" value="worker" class="d-none">
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <!-- Common Credentials Section (Email added here for ALL roles) -->
                            <div id="commonCredentials" style="display: none;" class="dynamic-field-anim mb-3">
                                <div class="p-3 rounded-4" style="background: rgba(255,255,255,0.4);">
                                    <div class="row g-3">
                                        
                                        <!-- Name -->
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Full Name <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                                <input type="text" name="name" class="form-control" required placeholder="Full name">
                                            </div>
                                        </div>
                                        
                                        <!-- Email (Now visible to everyone to fix backend error) -->
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Email Address <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                                <input type="email" name="email" class="form-control" required placeholder="name@example.com" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                                            </div>
                                        </div>

                                        <!-- Mobile Number -->
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Mobile Number <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <select name="country_code" id="country_code" class="form-select px-2" style="max-width: 95px; border-right: 1px solid var(--input-border); border-radius: 0;">
                                                    <option value="+91" selected>+91</option>
                                                    <option value="+1">+1</option>
                                                    <option value="+44">+44</option>
                                                    <option value="+971">+971</option>
                                                    <option value="+61">+61</option>
                                                </select>
                                                <input type="tel" name="mobile" class="form-control" required placeholder="Mobile number" pattern="[0-9]{7,15}" title="Enter a valid mobile number">
                                            </div>
                                        </div>
                                        
                                        <!-- Password -->
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Password <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                                <input type="password" name="password" class="form-control" required placeholder="Create password">
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>

                            <!-- Professional / Details Section -->
                            <div id="proFields" style="display: none;" class="dynamic-field-anim mb-3">
                                <div class="p-3 rounded-4" style="background: rgba(255,255,255,0.4);">
                                    
                                    <!-- Shop Name Input Field -->
                                    <div class="mb-3" id="shopNameContainer" style="display: none;">
                                        <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Shop / Business Name <span class="text-danger">*</span></label>
                                        <div class="input-group glass-input-group">
                                            <span class="input-group-text"><i class="fa-solid fa-shop"></i></span>
                                            <input type="text" name="shop_name" id="shopNameInput" class="form-control" placeholder="Enter shop/business name">
                                        </div>
                                    </div>

                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Expertise / Skill <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-screwdriver-wrench"></i></span>
                                                <input type="text" name="expertise" id="expertInput" class="form-control" placeholder="e.g. Electrician, Painter">
                                            </div>
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Experience (Years) <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-star"></i></span>
                                                <input type="text" name="experience" id="expInput" class="form-control" placeholder="e.g. 4">
                                            </div>
                                        </div>
                                        
                                        <div class="col-md-6" id="workerFields" style="display: none;">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Expected Daily Wage (₹) <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-indian-rupee-sign"></i></span>
                                                <input type="number" name="per_day_amount" id="wageInput" class="form-control" placeholder="e.g. 700">
                                            </div>
                                        </div>
                                        
                                        <div class="col-12" id="addressContainer">
                                            <label class="form-label text-secondary mb-1" style="font-size: 0.75rem; font-weight: 600;">Address / Location <span class="text-danger">*</span></label>
                                            <div class="input-group glass-input-group">
                                                <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                                <input type="text" name="address" id="addressInput" class="form-control" placeholder="Gali, Shop No, City, State...">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div id="actionContainer" style="display: none;" class="dynamic-field-anim mt-4">
                                <button type="submit" class="btn btn-gradient w-100 py-3 fw-bold shadow-sm" style="font-size: 1rem;">
                                    Create My Account <i class="fa-solid fa-arrow-right ms-2"></i>
                                </button>
                            </div>
                            
                            <div class="text-center mt-4">
                                <p class="text-dark small mb-0" style="font-size: 0.85rem; font-weight: 500;">
                                    Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #4338ca;">Sign in here</a>
                                </p>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function selectRole(role) {
        // 1. Reset active card classes
        document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
        
        // 2. Select corresponding hidden radio & activate card
        document.getElementById('role_' + role).checked = true;
        document.getElementById('card_' + role).classList.add('active');

        // 3. DOM references
        const commonCredentials = document.getElementById('commonCredentials');
        const proFields = document.getElementById('proFields');
        const shopNameContainer = document.getElementById('shopNameContainer');
        const workerFields = document.getElementById('workerFields');
        const addressContainer = document.getElementById('addressContainer');
        const actionContainer = document.getElementById('actionContainer');
        
        // Input Fields (No email here since it's universally required now)
        const shopNameInput = document.getElementById('shopNameInput');
        const wageInput = document.getElementById('wageInput');
        const reqInputs = [document.getElementById('addressInput'), document.getElementById('expInput'), document.getElementById('expertInput')];

        // Always show the common credentials (Name, Email, Mobile, Password)
        commonCredentials.style.display = 'block';
        actionContainer.style.display = 'block';

        // 4. Role logic adaptation 
        if (role === 'customer') {
            proFields.style.display = 'none';
            shopNameContainer.style.display = 'none';
            workerFields.style.display = 'none';
            
            // Remove required from ALL hidden pro fields for Customer
            shopNameInput.removeAttribute('required');
            wageInput.removeAttribute('required');
            reqInputs.forEach(input => input.removeAttribute('required'));
        } 
        else if (role === 'shop_owner') {
            proFields.style.display = 'block';
            shopNameContainer.style.display = 'block'; 
            workerFields.style.display = 'none';       
            
            // Set required for shown fields
            shopNameInput.setAttribute('required', 'true');
            reqInputs.forEach(input => input.setAttribute('required', 'true'));
            
            // Remove required for hidden fields
            wageInput.removeAttribute('required');
            
            // Full width for address to make it look balanced
            addressContainer.className = "col-12";
        } 
        else if (role === 'worker') {
            proFields.style.display = 'block';
            shopNameContainer.style.display = 'none';  
            workerFields.style.display = 'block';      
            
            // Set required for shown fields
            wageInput.setAttribute('required', 'true');
            reqInputs.forEach(input => input.setAttribute('required', 'true'));
            
            // Remove required for hidden fields
            shopNameInput.removeAttribute('required');
            
            // Adjust grid for Worker to fit Daily Wage nicely
            addressContainer.className = "col-md-6"; 
        }
    }
</script>
{% endblock %}
