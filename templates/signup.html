{% extends 'base.html' %}
{% block content %}
<style>
    /* =========================================
       PREMIUM SAAS INPUT REDESIGN (NON-SCROLL)
       ========================================= */
    :root {
        --indigo-primary: #4f46e5;
        --indigo-hover: #4338ca;
        --indigo-light: #eef2ff;
        --input-border: #cbd5e1;
        --input-focus: #4f46e5;
    }

    body {
        background-color: #f4f6fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .auth-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(79, 70, 229, 0.08);
        border: 1px solid rgba(79, 70, 229, 0.06);
    }

    /* Compact Role Grid Cards */
    .role-card {
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: #ffffff;
    }
    
    .role-card:hover {
        border-color: #cbd5e1;
        background-color: #fafbfc;
    }
    
    .role-card.active {
        border-color: var(--indigo-primary);
        background-color: var(--indigo-light);
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
    }
    
    .role-icon-box {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background-color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }
    
    .role-card.active .role-icon-box {
        background-color: var(--indigo-primary);
        color: white !important;
    }

    /* Premium Modern Input Styling */
    .input-group-text {
        background-color: #f8fafc;
        border: 1.5px solid var(--input-border);
        border-right: none;
        border-radius: 10px 0 0 10px;
        color: #64748b;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .custom-input {
        border-radius: 0 10px 10px 0;
        padding: 8px 12px;
        border: 1.5px solid var(--input-border);
        border-left: none;
        font-size: 0.86rem;
        background-color: #ffffff;
        color: #1e293b;
        transition: all 0.2s ease;
    }

    /* Single inputs without addon groups */
    .custom-input-standalone {
        border-radius: 10px;
        padding: 8px 12px;
        border: 1.5px solid var(--input-border);
        font-size: 0.86rem;
        background-color: #ffffff;
        color: #1e293b;
        transition: all 0.2s ease;
    }

    .custom-input:focus, .custom-input-standalone:focus {
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        background-color: #ffffff;
        outline: none;
    }

    /* When input is focused, style its addon box too */
    .input-group:focus-within .input-group-text {
        border-color: var(--input-focus);
        color: var(--indigo-primary);
        background-color: #eef2ff;
    }

    .btn-indigo {
        background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        color: white;
        border: none;
        transition: all 0.2s ease;
    }
    
    .btn-indigo:hover {
        background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
        color: white;
        box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .badge-pill {
        display: inline-block;
        padding: 4px 12px;
        background-color: var(--indigo-light);
        color: var(--indigo-primary);
        border-radius: 50px;
        font-weight: 700;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    .dynamic-field-anim {
        animation: fadeIn 0.25s ease forwards;
    }
</style>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
            
            <div class="auth-card p-3 p-md-4">
                
                <!-- Header -->
                <div class="text-center mb-3">
                    <span class="badge-pill mb-1">Kaamconnect</span>
                    <h4 class="fw-bold text-dark mb-1" style="font-size: 1.35rem;">Create Your Account</h4>
                    <p class="text-muted small mb-0" style="font-size: 0.8rem;">Select your profile type to proceed instantly.</p>
                </div>

                <form method="POST">
                    
                    <!-- Role Selection (Horizontal Compact Grid) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-uppercase text-secondary mb-2 d-block text-center" style="font-size: 0.72rem; letter-spacing: 0.5px;">Choose Profile Category</label>
                        <div class="row g-2">
                            
                            <div class="col-4">
                                <div class="role-card text-center p-2" id="card_customer" onclick="selectRole('customer')">
                                    <div class="role-icon-box mx-auto mb-1 text-primary">
                                        <i class="fa-solid fa-user-tie"></i>
                                    </div>
                                    <h6 class="fw-bold text-dark mb-0" style="font-size: 0.82rem;">Customer</h6>
                                    <span class="text-muted d-none d-md-block" style="font-size: 0.68rem;">Kaam karwana hai</span>
                                    <input type="radio" name="role" id="role_customer" value="customer" required class="d-none">
                                </div>
                            </div>

                            <div class="col-4">
                                <div class="role-card text-center p-2" id="card_shop_owner" onclick="selectRole('shop_owner')">
                                    <div class="role-icon-box mx-auto mb-1 text-success">
                                        <i class="fa-solid fa-shop"></i>
                                    </div>
                                    <h6 class="fw-bold text-dark mb-0" style="font-size: 0.82rem;">Shop Owner</h6>
                                    <span class="text-muted d-none d-md-block" style="font-size: 0.68rem;">Business & Leads</span>
                                    <input type="radio" name="role" id="role_shop_owner" value="shop_owner" class="d-none">
                                </div>
                            </div>

                            <div class="col-4">
                                <div class="role-card text-center p-2" id="card_worker" onclick="selectRole('worker')">
                                    <div class="role-icon-box mx-auto mb-1 text-warning">
                                        <i class="fa-solid fa-helmet-safety"></i>
                                    </div>
                                    <h6 class="fw-bold text-dark mb-0" style="font-size: 0.82rem;">Skilled Worker</h6>
                                    <span class="text-muted d-none d-md-block" style="font-size: 0.68rem;">Daily/Monthly Job</span>
                                    <input type="radio" name="role" id="role_worker" value="worker" class="d-none">
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Common Credentials Section (Premium Icon Inputs) -->
                    <div id="commonCredentials" style="display: none;" class="dynamic-field-anim mb-2">
                        <div class="p-2 p-md-3 rounded-3 border bg-white shadow-sm">
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                        <input type="text" name="name" class="form-control custom-input" required placeholder="Full name">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Mobile Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                                        <input type="text" name="mobile" class="form-control custom-input" required placeholder="10-digit mobile">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" name="password" class="form-control custom-input" required placeholder="Password">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Professional / Details Section (Premium Inputs with Icons) -->
                    <div id="proFields" style="display: none;" class="dynamic-field-anim mb-2">
                        <div class="p-2 p-md-3 rounded-3 border bg-white shadow-sm">
                            
                            <!-- Shop Name Input Field (Shown ONLY for Shop Owners) -->
                            <div class="mb-2" id="shopNameContainer" style="display: none;">
                                <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Shop / Business Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-shop"></i></span>
                                    <input type="text" name="shop_name" id="shopNameInput" class="form-control custom-input" placeholder="Enter shop/business name">
                                </div>
                            </div>

                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Expertise / Skill</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-screwdriver-wrench"></i></span>
                                        <input type="text" name="expertise" id="expertInput" class="form-control custom-input" placeholder="e.g. Electrician, Painter">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Experience (Years)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-star"></i></span>
                                        <input type="text" name="experience" id="expInput" class="form-control custom-input" placeholder="e.g. 4">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Email Address (Optional)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                        <input type="email" name="email" class="form-control custom-input" placeholder="name@example.com">
                                    </div>
                                </div>
                                <div class="col-md-6" id="workerFields" style="display: none;">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Expected Daily Wage (₹)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-indian-rupee-sign"></i></span>
                                        <input type="number" name="per_day_amount" id="wageInput" class="form-control custom-input" placeholder="e.g. 700">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-secondary mb-1" style="font-size: 0.73rem; font-weight: 600;">Address / Location</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                        <input type="text" name="address" id="addressInput" class="form-control custom-input" placeholder="Gali, Shop No, City, State...">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div id="actionContainer" style="display: none;" class="dynamic-field-anim mt-3">
                        <button type="submit" class="btn btn-indigo w-100 py-2 fw-bold rounded-3 shadow-sm" style="font-size: 0.95rem;">Create Account</button>
                    </div>
                    
                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0" style="font-size: 0.8rem;">Already have an account? <a href="{{ url_for('login') }}" class="text-indigo fw-bold text-decoration-none">Sign in here</a></p>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
    function selectRole(role) {
        // 1. Reset active card classes
        document.querySelectorAll('.role-card').forEach(card => card.classList.remove('active'));
        
        // 2. Select corresponding hidden radio & activate card
        document.getElementById('role_' + role).checked = true;
        document.getElementById('card_' + role).classList.add('active');

        // 3. DOM references
        const commonCredentials = document.getElementById('commonCredentials');
        const proFields = document.getElementById('proFields');
        const shopNameContainer = document.getElementById('shopNameContainer');
        const shopNameInput = document.getElementById('shopNameInput');
        const workerFields = document.getElementById('workerFields');
        const actionContainer = document.getElementById('actionContainer');
        
        const reqInputs = [document.getElementById('addressInput'), document.getElementById('expInput'), document.getElementById('expertInput')];
        const wageInput = document.getElementById('wageInput');

        // Show sections
        commonCredentials.style.display = 'block';
        actionContainer.style.display = 'block';

        // 4. Role logic adaptation
        if (role === 'customer') {
            proFields.style.display = 'none';
            shopNameContainer.style.display = 'none';
            workerFields.style.display = 'none';
            shopNameInput.removeAttribute('required');
            reqInputs.forEach(input => input.removeAttribute('required'));
            wageInput.removeAttribute('required');
        } 
        else if (role === 'shop_owner') {
            proFields.style.display = 'block';
            shopNameContainer.style.display = 'block'; // Shop name shown for shop owner
            workerFields.style.display = 'none';       // Wage hidden for shop owner
            shopNameInput.setAttribute('required', 'true');
            reqInputs.forEach(input => input.setAttribute('required', 'true'));
            wageInput.removeAttribute('required');
        } 
        else if (role === 'worker') {
            proFields.style.display = 'block';
            shopNameContainer.style.display = 'none';  // Shop name removed for worker
            workerFields.style.display = 'block';      // Wage shown for worker
            shopNameInput.removeAttribute('required');
            reqInputs.forEach(input => input.setAttribute('required', 'true'));
            wageInput.setAttribute('required', 'true');
        }
    }
</script>
{% endblock %}
